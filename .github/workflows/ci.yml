create-pr:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "Merge ${{ github.ref_name }} into main" \
            --body "Automatically created after successful CI."
